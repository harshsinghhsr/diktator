name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please don't paste private dictations; describe them instead.
        Security problems go through the Security tab, not here (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Focus a text field in …
        2. Hold the shortcut and say …
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Diktator version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows 11
        - Windows 10
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version and CPU
      placeholder: macOS 15.3, M2 / Windows 11 23H2, Ryzen 7 7840U
  - type: input
    id: models
    attributes:
      label: Speech and writing models
      placeholder: Parakeet v2, Qwen2.5 1.5B, Natural style
  - type: input
    id: target-app
    attributes:
      label: App you were dictating into
      placeholder: Slack desktop, Chrome (Gmail), VS Code…
  - type: textarea
    id: logs
    attributes:
      label: Log lines
      description: The `dictation: …` line and any warnings from the terminal or system log. They contain timings only, never text.
      render: text
