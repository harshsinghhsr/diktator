[package]
name = "diktator"
version = "0.1.0"
description = "On-device dictation that types clean text at your cursor"
edition = "2021"
license = "MIT"
default-run = "diktator"

[lib]
name = "diktator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "diktator"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
tauri = { version = "2.12.0", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-single-instance = "2.4.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0.104"
log = "0.4"
env_logger = "0.11"
cpal = "0.18.2"
rtrb = "0.4.0"
sherpa-onnx = "1.13.8"
global-hotkey = "0.8.0"
enigo = "0.6.1"
encoding_rs = "0.8"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "native-tls", "http2"] }
sha2 = "0.11.0"
bzip2 = "0.6.1"
tar = "0.4.46"

[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "0.1.157", default-features = false, features = ["metal"] }
tauri-nspanel = "2.1.0"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
dispatch2 = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
llama-cpp-2 = { version = "0.1.157", default-features = false }
windows = { version = "0.61.3", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
