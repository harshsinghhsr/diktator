# sherpa-onnx ships static libs built with the static CRT (/MT); llama.cpp and
# Rust must match or MSVC fails with LNK2038 RuntimeLibrary mismatch.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[env]
LLAMA_STATIC_CRT = "1"
# LLAMA_STATIC_CRT alone doesn't stick: CMake's default runtime (/MD) overrides it.
CMAKE_TOOLCHAIN_FILE_x86_64_pc_windows_msvc = { value = ".cargo/msvc-static-crt.cmake", relative = true }
CMAKE_TOOLCHAIN_FILE_aarch64_pc_windows_msvc = { value = ".cargo/msvc-static-crt.cmake", relative = true }
